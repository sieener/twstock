[mypy]
ignore_errors = True
check_untyped_defs = False
disallow_untyped_defs = False
disallow_incomplete_defs = False
warn_return_any = False
warn_unused_ignores = False
strict = False

[mypy-twstock.*]
ignore_errors = True

[pylint]
disable = all

[flake8]
ignore = E203, E266, E501, W503, F403, F401, E402
