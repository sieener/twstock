[build-system]
requires = ["flit_core >=2,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.metadata]
module = "twstock"
author = "Louie Lu"
author-email = "git@louie.lu"
maintainer = "Louie Lu"
maintainer-email = "git@louie.lu"
home-page = "https://github.com/mlouielu/twstock"
requires-python = ">=3.5"
requires = [ "requests",]
description-file = "README.md"
classifiers = [ "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3",]


[tool.flit.scripts]
twstock = "twstock.cli:run"

# Disable type checking for this project
[tool.mypy]
ignore_errors = true
check_untyped_defs = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_return_any = false
warn_unused_ignores = false
strict = false

[tool.pylsp-mypy]
enabled = false

[tool.pyright]
typeCheckingMode = "off"
reportGeneralTypeIssues = false
reportOptionalMemberAccess = false
reportOptionalSubscript = false
reportPrivateImportUsage = false
